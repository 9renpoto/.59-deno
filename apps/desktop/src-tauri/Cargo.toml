[package]
name = "desktop-tauri"
version = "0.1.0"
edition = "2021"
description = "Tauri application backend"

[lib]
name = "desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
