[package]
name = "desktop-frontend"
version = "0.1.0"
edition = "2021"
description = "Leptos WASM frontend for Desktop template"

[lib]
name = "desktop_frontend"
path = "src/lib.rs"

[[bin]]
name = "desktop-frontend"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Element", "HtmlInputElement"] }
